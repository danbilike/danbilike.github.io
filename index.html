<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DanbiLike — 마음에 내리는 단비 같은 앱</title>
<meta name="description" content="DanbiLike는 일상에 작은 위로를 건네는 따뜻한 모바일 앱을 만드는 1인 스튜디오입니다.">
<style>
  :root { --bg:#1E1B2E; --card:#2A2640; --text:#EDE9F7; --sub:#B8B2CC; --accent:#C9B8FF; }
  * { box-sizing: border-box; }
  body { margin:0; font-family:-apple-system,"Noto Sans KR","Apple SD Gothic Neo",sans-serif; background:var(--bg); color:var(--text); line-height:1.7; }
  .wrap { max-width:760px; margin:0 auto; padding:56px 20px 72px; }
  .logo { font-size:2.2rem; font-weight:800; letter-spacing:-.5px; margin:0; }
  .logo span { color:var(--accent); }
  .tag { color:var(--sub); margin:6px 0 40px; }
  h2 { font-size:1.1rem; color:var(--accent); margin:40px 0 14px; }
  .app { display:flex; gap:18px; align-items:center; background:var(--card); border-radius:22px; padding:18px; }
  .app img { width:84px; height:84px; border-radius:22px; flex-shrink:0; }
  .app h3 { margin:0 0 4px; font-size:1.15rem; }
  .app p { margin:0 0 8px; color:var(--sub); font-size:.95rem; }
  .links a { color:var(--accent); font-size:.9rem; margin-right:14px; text-decoration:none; }
  footer { margin-top:56px; color:var(--sub); font-size:.85rem; }
</style>
</head>
<body>
<div class="wrap">
  <p class="logo">Danbi<span>Like</span></p>
  <p class="tag">가뭄 끝 단비처럼, 지친 하루에 작은 위로를 건네는 앱을 만듭니다.</p>

  <h2>앱</h2>
  <div class="app">
    <img src="moodtherapy-icon.png" alt="MoodTherapy 아이콘">
    <div>
      <h3>MoodTherapy</h3>
      <p>오늘의 마음을 고르면 위로 카드 한 장. 하루 한 칸 채우는 픽셀 감정 달력. 완전 오프라인.</p>
      <div class="links"><a href="moodtherapy-privacy.html">개인정보처리방침</a></div>
    </div>
  </div>

  <h2>문의</h2>
  <p>앱에 대한 의견이나 문의는 <a style="color:var(--accent)" href="mailto:thinkcentre.dev@gmail.com">thinkcentre.dev@gmail.com</a> 으로 보내 주세요.</p>

  <footer>© 2026 DanbiLike · James Jeong</footer>
</div>
</body>
</html>
